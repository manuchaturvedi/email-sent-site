<svg width="1920" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e6cf;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b9fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="2" fill="white" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1920" height="600" fill="url(#heroGrad)"/>
  <rect width="1920" height="600" fill="url(#dots)"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="80" fill="white" opacity="0.05"/>
  <circle cx="1700" cy="450" r="100" fill="white" opacity="0.05"/>
  <circle cx="1600" cy="150" r="60" fill="white" opacity="0.08"/>
  <circle cx="300" cy="500" r="70" fill="white" opacity="0.06"/>
  
  <!-- Lines -->
  <line x1="100" y1="100" x2="400" y2="250" stroke="white" stroke-width="2" opacity="0.1"/>
  <line x1="1500" y1="100" x2="1800" y2="300" stroke="white" stroke-width="2" opacity="0.1"/>
</svg>
