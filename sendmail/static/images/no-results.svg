<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f0e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Empty box -->
  <rect x="40" y="60" width="120" height="100" rx="10" fill="url(#emptyGrad)" stroke="#d0d0d0" stroke-width="2"/>
  <rect x="50" y="70" width="100" height="2" fill="#e0e0e0"/>
  <rect x="50" y="85" width="80" height="2" fill="#e0e0e0"/>
  <rect x="50" y="100" width="90" height="2" fill="#e0e0e0"/>
  <rect x="50" y="115" width="70" height="2" fill="#e0e0e0"/>
  
  <!-- Magnifying glass -->
  <circle cx="150" cy="140" r="20" fill="none" stroke="#a8e6cf" stroke-width="4"/>
  <line x1="164" y1="154" x2="180" y2="170" stroke="#a8e6cf" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Sad face in box -->
  <circle cx="100" cy="110" r="15" fill="white" opacity="0.5"/>
  <circle cx="95" cy="105" r="2" fill="#999"/>
  <circle cx="105" cy="105" r="2" fill="#999"/>
  <path d="M 92 115 Q 100 112 108 115" stroke="#999" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
