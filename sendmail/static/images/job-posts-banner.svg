<svg width="1920" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e6cf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b9fff;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern1" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.15)"/>
    </pattern>
  </defs>
  <rect width="1920" height="300" fill="url(#gradient1)"/>
  <rect width="1920" height="300" fill="url(#pattern1)"/>
  
  <!-- Briefcase Icon -->
  <g transform="translate(250, 100)">
    <rect x="0" y="20" width="80" height="60" rx="8" fill="white" opacity="0.2"/>
    <path d="M20 20 h40 v-10 a5 5 0 0 0-5-5 h-30 a5 5 0 0 0-5 5 v10" fill="white" opacity="0.2"/>
    <rect x="30" y="35" width="20" height="8" rx="4" fill="white" opacity="0.3"/>
  </g>
  
  <!-- Mail Icons -->
  <g transform="translate(1550, 80)">
    <rect x="0" y="0" width="60" height="45" rx="6" fill="white" opacity="0.15"/>
    <polyline points="0,0 30,25 60,0" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
  </g>
  
  <g transform="translate(1600, 200)">
    <rect x="0" y="0" width="50" height="37" rx="5" fill="white" opacity="0.12"/>
    <polyline points="0,0 25,20 50,0" fill="none" stroke="white" stroke-width="1.5" opacity="0.15"/>
  </g>
  
  <!-- Chart Icon -->
  <g transform="translate(150, 180)">
    <line x1="10" y1="50" x2="10" y2="20" stroke="white" stroke-width="6" opacity="0.15" stroke-linecap="round"/>
    <line x1="30" y1="50" x2="30" y2="5" stroke="white" stroke-width="6" opacity="0.2" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="50" y2="30" stroke="white" stroke-width="6" opacity="0.15" stroke-linecap="round"/>
  </g>
</svg>
