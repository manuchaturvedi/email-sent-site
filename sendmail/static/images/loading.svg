<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e6cf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b9fff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rotating circle -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#loadGrad)" stroke-width="6" stroke-dasharray="150 70" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="8" fill="url(#loadGrad)">
    <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
